<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send-it-easy</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #10131a; color: #edf1f7; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, #26395a, transparent 45%), #10131a; }
    main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: -0.06em; }
    .subtitle { color: #aab6ca; margin: 0 0 32px; font-size: 1.1rem; }
    section { background: rgba(24, 29, 40, .9); border: 1px solid #313b4f; border-radius: 20px; padding: 24px; margin-top: 20px; box-shadow: 0 12px 35px rgba(0,0,0,.18); }
    .code { color: #9ee6b5; font: 700 1.5rem ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .15em; }
    .drop { display: block; border: 2px dashed #526886; border-radius: 16px; padding: 36px 20px; text-align: center; cursor: pointer; transition: .2s; }
    .drop:hover, .drop.dragging { border-color: #8ab4ff; background: #202d44; }
    input[type=file] { display: none; }
    button { background: #8ab4ff; border: 0; color: #10131a; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .files { display: grid; gap: 10px; margin-top: 18px; }
    .file { display: flex; justify-content: space-between; align-items: center; gap: 16px; background: #202735; border-radius: 12px; padding: 12px 14px; }
    .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta, .status { color: #aab6ca; font-size: .9rem; }
    progress { width: 100%; height: 10px; margin-top: 16px; accent-color: #8ab4ff; }
    .empty { color: #7f8ba0; text-align: center; padding: 16px; }
    .error { color: #ff9e9e; margin-top: 12px; }
    .login { max-width: 420px; margin: 48px auto; text-align: center; }
    .login input { box-sizing: border-box; width: 100%; margin: 18px 0 12px; padding: 13px 14px; border: 1px solid #526886; border-radius: 10px; background: #10131a; color: #edf1f7; font: 1.2rem ui-monospace, SFMono-Regular, Consolas, monospace; text-align: center; letter-spacing: .15em; }
    .topbar { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .topbar h1 { font-size: clamp(2rem, 5vw, 3.5rem); }
    .screen-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .screen-video { width: 100%; max-height: 520px; background: #05070a; border-radius: 12px; margin-top: 16px; }
    .request { margin-top: 12px; }
    .pending { display: grid; gap: 8px; margin-top: 14px; }
    .pending-item { display: flex; justify-content: space-between; gap: 12px; align-items: center; background: #202735; border-radius: 10px; padding: 10px 12px; }
  </style>
</head>
<body>
  <main id="loginView" class="login">
    <h1>Send-it-easy</h1>
    <p class="subtitle">Enter the access code shown on the host computer.</p>
    <section>
      <form id="loginForm">
        <label class="meta" for="accessCode">Access code</label>
        <input id="accessCode" inputmode="text" autocomplete="off" maxlength="32" required autofocus>
        <button type="submit">Connect</button>
        <div class="error" id="loginError"></div>
      </form>
    </section>
  </main>
  <main id="appView" hidden>
    <div class="topbar"><div><h1>Send-it-easy</h1><p class="subtitle">Share files with devices on this Wi-Fi network.</p></div><button id="logout">Disconnect</button></div>
    <section>
      <label class="drop" id="drop">
        <input id="picker" type="file" multiple>
        <strong>Choose files or drag them here</strong><br>
        <span class="meta">Files are saved to the host's shared folder.</span>
      </label>
      <progress id="progress" value="0" max="100" hidden></progress>
      <div class="status" id="status"></div>
      <div class="error" id="error"></div>
    </section>
    <section>
      <h2>Screen sharing</h2>
      <p class="meta">The host chooses what to share. Video travels directly between browsers and is not saved.</p>
      <div id="hostScreenControls" hidden>
        <div class="screen-controls">
          <button id="startScreen">Share my screen</button>
          <button id="stopScreen" hidden>Stop sharing</button>
        </div>
        <div class="pending" id="pendingViewers"></div>
        <video id="hostPreview" class="screen-video" autoplay muted playsinline hidden></video>
      </div>
      <div id="viewerScreenControls" hidden>
        <button class="request" id="requestScreen">Request to view host screen</button>
        <div class="status" id="screenStatus"></div>
        <video id="viewerVideo" class="screen-video" autoplay playsinline hidden></video>
      </div>
      <div class="error" id="screenError"></div>
    </section>
    <section>
      <h2>Available files</h2>
      <div class="files" id="files"><div class="empty">Loading files…</div></div>
    </section>
  </main>
  <script>
    const loginView = document.querySelector("#loginView");
    const appView = document.querySelector("#appView");
    const loginForm = document.querySelector("#loginForm");
    const loginError = document.querySelector("#loginError");
    const picker = document.querySelector("#picker");
    const drop = document.querySelector("#drop");
    const progress = document.querySelector("#progress");
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const hostScreenControls = document.querySelector("#hostScreenControls");
    const viewerScreenControls = document.querySelector("#viewerScreenControls");
    const startScreen = document.querySelector("#startScreen");
    const stopScreen = document.querySelector("#stopScreen");
    const requestScreen = document.querySelector("#requestScreen");
    const pendingViewers = document.querySelector("#pendingViewers");
    const hostPreview = document.querySelector("#hostPreview");
    const viewerVideo = document.querySelector("#viewerVideo");
    const screenStatus = document.querySelector("#screenStatus");
    const screenError = document.querySelector("#screenError");
    let screenSocket;
    let isHost = false;
    let hostStream;
    const hostPeers = new Map();
    let viewerPeerState;

    async function showApp() {
      loginView.hidden = true;
      appView.hidden = false;
      loadFiles().catch((reason) => error.textContent = reason.message);
      await setupScreenSharing();
    }
    async function setupScreenSharing() {
      const hostResponse = await fetch("/api/host-session", { method: "POST" });
      isHost = hostResponse.ok;
      hostScreenControls.hidden = !isHost;
      viewerScreenControls.hidden = isHost;
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      screenSocket = new WebSocket(`${protocol}//${location.host}/ws`);
      screenSocket.onopen = () => {
        if (!isHost) screenStatus.textContent = "Connected. You can request the host screen.";
      };
      screenSocket.onclose = () => {
        screenError.textContent = "Screen sharing connection closed. Refresh this page and try again.";
      };
      screenSocket.onmessage = handleScreenMessage;
      screenSocket.onerror = () => screenError.textContent = "Screen sharing could not connect.";
    }
    function sendScreen(message) {
      if (screenSocket?.readyState === WebSocket.OPEN) screenSocket.send(JSON.stringify(message));
    }
    function createHostPeer(viewerId) {
      const peer = new RTCPeerConnection();
      const state = { peer, remoteDescriptionSet: false, pendingCandidates: [] };
      hostPeers.set(viewerId, state);
      for (const track of hostStream.getTracks()) peer.addTrack(track, hostStream);
      peer.onicecandidate = (event) => {
        if (event.candidate) sendScreen({ type: "signal", viewerId, data: { candidate: event.candidate } });
      };
      peer.onconnectionstatechange = () => {
        if (["failed", "disconnected"].includes(peer.connectionState)) {
          screenError.textContent = `Viewer connection ${peer.connectionState}. Try stopping and starting screen sharing again.`;
        }
      };
      peer.createOffer().then((offer) => peer.setLocalDescription(offer))
        .then(() => sendScreen({ type: "signal", viewerId, data: { description: peer.localDescription } }));
    }
    function createViewerPeer() {
      const peer = new RTCPeerConnection();
      viewerPeerState = { peer, remoteDescriptionSet: false, pendingCandidates: [] };
      peer.ontrack = (event) => {
        viewerVideo.hidden = false;
        viewerVideo.srcObject = event.streams[0];
      };
      peer.onicecandidate = (event) => {
        if (event.candidate) sendScreen({ type: "signal", data: { candidate: event.candidate } });
      };
      peer.onconnectionstatechange = () => {
        if (peer.connectionState === "connected") screenStatus.textContent = "Screen connected.";
        if (["failed", "disconnected"].includes(peer.connectionState)) {
          screenStatus.textContent = `Screen connection ${peer.connectionState}.`;
        }
      };
      return viewerPeerState;
    }
    async function addPendingCandidates(state) {
      for (const candidate of state.pendingCandidates.splice(0)) {
        await state.peer.addIceCandidate(candidate);
      }
    }
    async function setRemoteDescription(state, description) {
      await state.peer.setRemoteDescription(description);
      state.remoteDescriptionSet = true;
      await addPendingCandidates(state);
    }
    async function addCandidate(state, candidate) {
      if (!state.remoteDescriptionSet) {
        state.pendingCandidates.push(candidate);
        return;
      }
      await state.peer.addIceCandidate(candidate);
    }
    async function handleScreenMessage(event) {
      const message = JSON.parse(event.data);
      if (message.type === "viewer-request" && isHost) {
        const row = document.createElement("div");
        row.className = "pending-item";
        row.dataset.viewerId = message.viewerId;
        row.innerHTML = `<span>Device ${message.viewerId.slice(0, 6)} wants to view</span>`;
        const approve = document.createElement("button");
        approve.textContent = "Allow";
        approve.onclick = () => {
          sendScreen({ type: "approve-viewer", viewerId: message.viewerId });
          createHostPeer(message.viewerId);
          row.remove();
        };
        const deny = document.createElement("button");
        deny.textContent = "Deny";
        deny.onclick = () => {
          sendScreen({ type: "deny-viewer", viewerId: message.viewerId });
          row.remove();
        };
        row.append(approve, deny);
        pendingViewers.append(row);
      } else if (message.type === "viewer-approved" && !isHost) {
        screenStatus.textContent = "The host approved your request.";
        createViewerPeer();
      } else if (message.type === "viewer-denied" && !isHost) {
        screenStatus.textContent = "The host denied your request.";
        requestScreen.disabled = false;
      } else if (message.type === "signal") {
        if (isHost) {
          const state = hostPeers.get(message.viewerId);
          if (!state) return;
          if (message.data.description) await setRemoteDescription(state, message.data.description);
          if (message.data.candidate) await addCandidate(state, message.data.candidate);
        } else {
          const state = viewerPeerState || createViewerPeer();
          if (message.data.description?.type === "offer") {
            await setRemoteDescription(state, message.data.description);
            const answer = await state.peer.createAnswer();
            await state.peer.setLocalDescription(answer);
            sendScreen({ type: "signal", data: { description: state.peer.localDescription } });
          } else if (message.data.description) {
            await setRemoteDescription(state, message.data.description);
          } else if (message.data.candidate) {
            await addCandidate(state, message.data.candidate);
          }
        }
      } else if (message.type === "screen-ended" && !isHost) {
        viewerVideo.hidden = true;
        viewerVideo.srcObject = null;
        screenStatus.textContent = "The host stopped sharing.";
      }
    }
    startScreen.addEventListener("click", async () => {
      screenError.textContent = "";
      try {
        hostStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        hostPreview.srcObject = hostStream;
        hostPreview.hidden = false;
        startScreen.hidden = true;
        stopScreen.hidden = false;
        hostStream.getVideoTracks()[0].onended = () => stopScreen.click();
      } catch (reason) {
        screenError.textContent = `Screen sharing was not started: ${reason.message}`;
      }
    });
    stopScreen.addEventListener("click", () => {
      hostStream?.getTracks().forEach((track) => track.stop());
      hostStream = null;
      for (const state of hostPeers.values()) state.peer.close();
      hostPeers.clear();
      hostPreview.srcObject = null;
      hostPreview.hidden = true;
      startScreen.hidden = false;
      stopScreen.hidden = true;
      sendScreen({ type: "screen-ended" });
    });
    requestScreen.addEventListener("click", () => {
      requestScreen.disabled = true;
      screenStatus.textContent = "Waiting for the host to approve…";
      sendScreen({ type: "request-viewer" });
    });
    async function checkSession() {
      const response = await fetch("/api/files");
      if (response.ok) showApp();
    }
    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginError.textContent = "";
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: document.querySelector("#accessCode").value.trim() })
      });
      if (!response.ok) {
        loginError.textContent = (await response.json()).error;
        return;
      }
      showApp();
    });
    document.querySelector("#logout").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      location.reload();
    });
    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      const units = ["KB", "MB", "GB"];
      let value = bytes / 1024, unit = 0;
      while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
      return `${value.toFixed(value >= 10 ? 0 : 1)} ${units[unit]}`;
    }
    async function loadFiles() {
      const response = await fetch("/api/files");
      if (!response.ok) throw new Error((await response.json()).error);
      const { files } = await response.json();
      const container = document.querySelector("#files");
      container.replaceChildren();
      if (!files.length) { container.innerHTML = '<div class="empty">No files shared yet.</div>'; return; }
      for (const file of files) {
        const row = document.createElement("div");
        row.className = "file";
        row.innerHTML = `<div><div class="file-name"></div><div class="meta">${formatSize(file.size)}</div></div>`;
        row.querySelector(".file-name").textContent = file.name;
        const link = document.createElement("a");
        link.href = `/download/${encodeURIComponent(file.name)}`;
        link.innerHTML = "<button>Download</button>";
        row.append(link);
        container.append(row);
      }
    }
    function upload(file) {
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open("POST", `/api/upload?filename=${encodeURIComponent(file.name)}`);
        request.upload.onprogress = (event) => {
          if (event.lengthComputable) progress.value = (event.loaded / event.total) * 100;
        };
        request.onload = () => request.status >= 200 && request.status < 300
          ? resolve() : reject(new Error(JSON.parse(request.responseText).error || "Upload failed."));
        request.onerror = () => reject(new Error("The upload could not reach the host."));
        request.send(file);
      });
    }
    async function uploadFiles(files) {
      error.textContent = "";
      progress.hidden = false;
      for (const file of files) {
        status.textContent = `Uploading ${file.name}…`;
        try { await upload(file); } catch (reason) { error.textContent = reason.message; break; }
      }
      status.textContent = "Ready";
      progress.hidden = true;
      await loadFiles();
    }
    picker.addEventListener("change", () => uploadFiles(picker.files));
    ["dragenter", "dragover"].forEach((event) => drop.addEventListener(event, (e) => { e.preventDefault(); drop.classList.add("dragging"); }));
    ["dragleave", "drop"].forEach((event) => drop.addEventListener(event, (e) => { e.preventDefault(); drop.classList.remove("dragging"); }));
    drop.addEventListener("drop", (event) => uploadFiles(event.dataTransfer.files));
    checkSession();
  </script>
</body>
</html>
